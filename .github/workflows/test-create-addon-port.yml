name: Test Create addon 26.2 port

on:
  pull_request:
    branches: [main]
    paths:
      - 'RUN_PORT_TEST'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Create Fly 26.2
        uses: actions/checkout@v4
        with:
          repository: ZurrTum/Create-Fly
          ref: 26.2
          path: Create-Fly

      - name: Checkout CDP 26.2 port
        uses: actions/checkout@v4
        with:
          repository: Hassan3-4/GPT
          ref: cdp-26.2-port
          path: CreateDragonsPlus

      - name: Checkout CEI 26.2 port
        uses: actions/checkout@v4
        with:
          repository: Hassan3-4/GPT
          ref: cei-26.2-port
          path: CreateEnchantmentIndustry

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Build Create Fly
        working-directory: Create-Fly
        run: |
          chmod +x gradlew
          ./gradlew clean build --stacktrace --no-daemon

      - name: Build Create Dragons Plus
        working-directory: CreateDragonsPlus
        run: |
          chmod +x gradlew
          ./gradlew clean build --stacktrace --no-daemon

      - name: Build Create Enchantment Industry
        working-directory: CreateEnchantmentIndustry
        shell: bash
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew clean build --stacktrace --warning-mode all --no-daemon 2>&1 | tee ../cei-build.log

      - name: Upload CEI compiler log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cei-build-log
          path: cei-build.log
          if-no-files-found: warn

      - name: Upload CEI jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: cei-26.2-jar
          path: CreateEnchantmentIndustry/build/libs/*.jar
          if-no-files-found: error
