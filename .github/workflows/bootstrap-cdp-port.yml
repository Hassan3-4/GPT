name: Bootstrap CDP 26.2 port

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bootstrap-cdp-port.yml'
  pull_request:
    branches: [main]
    paths:
      - 'RUN_CDP_BOOTSTRAP'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout workspace
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout CDP Fabric 1.21.11 base
        uses: actions/checkout@v4
        with:
          repository: YU322142/CreateDragonsPlus
          ref: fabric/1.21.11
          path: upstream-cdp

      - name: Import upstream source to dedicated branch
        shell: bash
        run: |
          set -euxo pipefail
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B cdp-26.2-port
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name upstream-cdp -exec rm -rf {} +
          rsync -a --exclude='.git' --exclude='.github/workflows/' upstream-cdp/ ./
          rm -rf upstream-cdp .gitmodules
          git add -A
          git commit -m "Import CDP Fabric 1.21.11 port as 26.2 base"
          git push --force origin cdp-26.2-port
