plugins {
    id "net.fabricmc.fabric-loom" version "1.16-SNAPSHOT"
    id "java-library"
}

version = "1.11.2-beta.4+fabric.26.2"
group = "plus.dragons.createdragonsplus"

base {
    archivesName = "create-dragons-plus"
}

repositories {
    mavenCentral()
    maven { url = "https://mvn.devos.one/snapshots" }
    maven { url = "https://maven.blamejared.com" }
    maven { url = "https://maven.terraformersmc.com/releases" }
    exclusiveContent {
        forRepository {
            maven { url = "https://api.modrinth.com/maven" }
        }
        filter { includeGroup "maven.modrinth" }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:26.2-rc-2"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:0.19.3"
    modImplementation "net.fabricmc.fabric-api:fabric-api:0.152.0+26.2"
    def localCreateFlyRuntime = file("../Create-Fly/build/libs/create-fly-26.2-rc-2-6.0.9-1.jar")
    if (!localCreateFlyRuntime.isFile()) {
        throw new GradleException("Build the sibling ZurrTum/Create-Fly 26.2 branch first")
    }
    modImplementation files(localCreateFlyRuntime)
    modImplementation "maven.modrinth:forge-config-api-port:26.2.1"
    compileOnly "javax.annotation:javax.annotation-api:1.3.2"
    compileOnly "com.google.code.findbugs:jsr305:3.0.2"
}

sourceSets.main.resources {
    srcDir "src/generated/resources"
    srcDir "src/main/translations"
}

// NeoForge builds compile their data generators and event-bus adapters into the
// main artifact. Fabric Loom has no equivalents for those development-only
// APIs, and none of these classes are needed to load or play CDP. Keep the
// source files in the port, but split them out of the Fabric runtime source set.
sourceSets.main.java {
    srcDir "src/integration/dyenamics/java"
    srcDir "src/integration/dye_depot/java"
    srcDir "src/integration/arts_and_crafts/java"
    exclude "plus/dragons/createdragonsplus/integration/dyenamics/DyenamicsExtension.java"
    exclude "plus/dragons/createdragonsplus/integration/dye_depot/DyeDepotExtension.java"
    exclude "plus/dragons/createdragonsplus/integration/arts_and_crafts/ArtsAndCraftsExtension.java"
    exclude "plus/dragons/createdragonsplus/integration/dyenamics/package-info.java"
    exclude "plus/dragons/createdragonsplus/integration/dye_depot/package-info.java"
    exclude "plus/dragons/createdragonsplus/integration/arts_and_crafts/package-info.java"
    exclude "plus/dragons/createdragonsplus/data/**"
    exclude "plus/dragons/createdragonsplus/common/CDPRegistrate.java"
    exclude "plus/dragons/createdragonsplus/common/registrate/**"
    exclude "plus/dragons/createdragonsplus/common/advancements/**"
    exclude "plus/dragons/createdragonsplus/common/recipe/BaseRecipeBuilder.java"
    exclude "plus/dragons/createdragonsplus/common/recipe/RecipeConverter.java"
    exclude "plus/dragons/createdragonsplus/common/recipe/UpdateRecipesEvent.java"
    exclude "plus/dragons/createdragonsplus/common/registry/CDPCapabilities.java"
    exclude "plus/dragons/createdragonsplus/common/registry/CDPConditions.java"
    exclude "plus/dragons/createdragonsplus/common/registry/CDPCriterions.java"
    exclude "plus/dragons/createdragonsplus/common/registry/CDPDataMaps.java"
    exclude "plus/dragons/createdragonsplus/common/registry/CDPLoots.java"
    exclude "plus/dragons/createdragonsplus/common/registry/CDPBlockFreezers.java"
    exclude "plus/dragons/createdragonsplus/integration/CDPCompatFix.java"
    exclude "plus/dragons/createdragonsplus/integration/immersive_engineering/**"
    exclude "plus/dragons/createdragonsplus/integration/jei/**"
    exclude "plus/dragons/createdragonsplus/client/color/SimpleItemColors.java"
    exclude "plus/dragons/createdragonsplus/client/ponder/**"
    exclude "plus/dragons/createdragonsplus/client/renderer/blockentity/**"
    exclude "plus/dragons/createdragonsplus/common/behaviours/**"
    exclude "plus/dragons/createdragonsplus/common/fluids/SolidRenderFluidType.java"
    exclude "plus/dragons/createdragonsplus/common/fluids/dragonBreath/DragonBreathFluidType.java"
    exclude "plus/dragons/createdragonsplus/common/fluids/dye/DyeFluidType.java"
    exclude "plus/dragons/createdragonsplus/common/fluids/WaterAndLavaLoggedBlock.java"
    exclude "plus/dragons/createdragonsplus/common/fluids/tank/**"
    exclude "plus/dragons/createdragonsplus/common/processing/blaze/**"
    exclude "plus/dragons/createdragonsplus/config/StressConfig.java"
    exclude "plus/dragons/createdragonsplus/mixin/neoforge/**"
    exclude "plus/dragons/createdragonsplus/mixin/util/RunDataMixinCondition.java"
    exclude "plus/dragons/createdragonsplus/mixin/minecraft/IngredientValueMixin.java"
    exclude "plus/dragons/createdragonsplus/mixin/minecraft/RecipeManagerAccessor.java"
    exclude "plus/dragons/createdragonsplus/mixin/minecraft/ReloadableServerResourcesMixin.java"
    exclude "plus/dragons/createdragonsplus/mixin/create/AirFlowParticleMixin.java"
    exclude "plus/dragons/createdragonsplus/mixin/create/AirCurrentMixin.java"
    exclude "plus/dragons/createdragonsplus/mixin/create/BlockEntityBehaviourMixin.java"
    exclude "plus/dragons/createdragonsplus/mixin/create/FluidFillingBehaviourMixin.java"
    exclude "plus/dragons/createdragonsplus/mixin/create/MechanicalMixerBlockEntityMixin.java"
    exclude "plus/dragons/createdragonsplus/mixin/create/OpenEndFluidHandlerMixin.java"
    exclude "plus/dragons/createdragonsplus/mixin/create/OpenEndedPipeMixin.java"
    exclude "plus/dragons/createdragonsplus/mixin/create/ContraptionMixin.java"
    exclude "plus/dragons/createdragonsplus/mixin/minecraft/BottleItemMixin.java"
    exclude "plus/dragons/createdragonsplus/mixin/minecraft/ConcretePowderBlockMixin.java"
}

def resolvedModVersion = version.toString()

processResources {
    inputs.property "version", resolvedModVersion
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    filesMatching("fabric.mod.json") {
        expand "version": resolvedModVersion
    }
    exclude "META-INF/**"
    exclude "pack.mcmeta"
    exclude "data/**/data_maps/**"
    exclude "**/*fragile_fluid_tank*.json"
    from("src/main/resources/assets/create_dragons_plus/textures/item/package") {
        include "rare_blaze.png", "rare_marble_gate.png"
        into "assets/create_dragons_plus/textures/block/package"
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release.set(25)
    options.encoding = "UTF-8"
    options.compilerArgs.addAll(["-Xmaxerrs", "2000", "-Xdiags:verbose"])
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
    withSourcesJar()
}

tasks.named("sourcesJar") {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from("LICENSE.txt")
    from("LICENSE-CREATE.txt")
    from("LICENSING.txt")
    from("UNOFFICIAL_FORK_NOTICE.md")
}

tasks.named("jar", Jar) {
    from("LICENSE.txt")
    from("LICENSE-CREATE.txt")
    from("LICENSING.txt")
    from("UNOFFICIAL_FORK_NOTICE.md")
}
