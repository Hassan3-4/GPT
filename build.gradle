plugins {
    id "net.fabricmc.fabric-loom" version "1.16-SNAPSHOT"
    id "java-library"
}

version = "1.11.2-beta.4+fabric.26.2"
group = "plus.dragons.createdragonsplus"

base {
    archivesName = "create-dragons-plus"
}

repositories {
    mavenCentral()
    exclusiveContent {
        forRepository { maven { url = "https://api.modrinth.com/maven" } }
        filter { includeGroup "maven.modrinth" }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:26.2-rc-2"
    implementation "net.fabricmc:fabric-loader:0.19.3"
    implementation "net.fabricmc.fabric-api:fabric-api:0.152.0+26.2"
    def localCreateFlyRuntime = file("../Create-Fly/build/libs/create-fly-26.2-rc-2-6.0.9-1.jar")
    if (!localCreateFlyRuntime.isFile())
        throw new GradleException("Build the sibling ZurrTum/Create-Fly 26.2 branch first")
    implementation files(localCreateFlyRuntime)
    implementation "maven.modrinth:forge-config-api-port:26.2.1"
    compileOnly "javax.annotation:javax.annotation-api:1.3.2"
    compileOnly "com.google.code.findbugs:jsr305:3.0.2"
}

sourceSets.main.java {
    setSrcDirs(["src/main/java"])
    include "plus/dragons/createdragonsplus/common/CDPCommon.java"
    include "plus/dragons/createdragonsplus/common/registry/CDPBlocks.java"
    include "plus/dragons/createdragonsplus/common/registry/CDPBlockEntities.java"
    include "plus/dragons/createdragonsplus/common/registry/CDPItems.java"
    include "plus/dragons/createdragonsplus/common/fluids/hatch/**"
    include "plus/dragons/createdragonsplus/common/fluids/StandardDispenserBehaviour.java"
    include "plus/dragons/createdragonsplus/client/CDPClient.java"
    include "plus/dragons/createdragonsplus/client/texture/CDPGuiTextures.java"
    include "plus/dragons/createdragonsplus/platform/create/**"
    include "plus/dragons/createdragonsplus/util/FieldsNullabilityUnknownByDefault.java"
}

sourceSets.main.resources {
    srcDir "src/generated/resources"
    srcDir "src/main/translations"
}

def resolvedModVersion = version.toString()
processResources {
    inputs.property "version", resolvedModVersion
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    filesMatching("fabric.mod.json") { expand "version": resolvedModVersion }
    exclude "META-INF/**"
    exclude "pack.mcmeta"
    exclude "data/**/data_maps/**"
    exclude "**/*fragile_fluid_tank*.json"
}

tasks.withType(JavaCompile).configureEach {
    options.release.set(25)
    options.encoding = "UTF-8"
    options.compilerArgs.addAll(["-Xmaxerrs", "2000", "-Xdiags:verbose"])
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
    withSourcesJar()
}

tasks.named("sourcesJar") {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from("LICENSE.txt")
    from("LICENSE-CREATE.txt")
    from("LICENSING.txt")
    from("UNOFFICIAL_FORK_NOTICE.md")
}

tasks.named("jar", Jar) {
    from("LICENSE.txt")
    from("LICENSE-CREATE.txt")
    from("LICENSING.txt")
    from("UNOFFICIAL_FORK_NOTICE.md")
}
